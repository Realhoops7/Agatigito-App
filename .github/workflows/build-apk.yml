name: Build Android APK

# Runs on every push to main, and can also be triggered manually from the
# Actions tab (the workflow_dispatch entry below adds a "Run workflow"
# button in GitHub's UI).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (required by Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build
        env:
          # Set this in GitHub → Settings → Secrets and variables → Actions
          # → New repository secret, named exactly VITE_GOOGLE_MAPS_API_KEY.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Add the Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web build into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agatigito-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
